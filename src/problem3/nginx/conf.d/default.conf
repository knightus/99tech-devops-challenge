server {
    listen 80;

    # A literal hostname in proxy_pass is resolved once at startup. When the
    # api container is recreated (deploy, --build, scaling) it gets a new IP and
    # nginx kept sending traffic to the old one: 502 until nginx was restarted.
    # Docker's embedded DNS plus a variable makes nginx re-resolve every 10s.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;

    location = / {
        # `return` sets no Content-Type, so nginx fell back to
        # application/octet-stream and browsers downloaded the page.
        default_type text/plain;
        return 200 "Welcome to the platform\n";
    }

    location /api/ {
        proxy_pass $api_upstream;
        # Default read timeout is 60s; one stalled upstream would hold nginx
        # connections for a minute each. Kept above the API's own DB timeouts
        # so the API can still answer with its JSON error first.
        proxy_connect_timeout 2s;
        proxy_read_timeout    10s;
    }

    # Health endpoints for load balancers and uptime checks. Not logged, so
    # frequent probes do not drown out real traffic.
    location ~ ^/(status|ready)$ {
        proxy_pass $api_upstream;
        proxy_connect_timeout 2s;
        proxy_read_timeout    5s;
        access_log off;
    }
}
