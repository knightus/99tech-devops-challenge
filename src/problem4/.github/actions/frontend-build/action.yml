name: Frontend build
description: Build the SPA once and stamp it with a version file the deploy can verify.

inputs:
  version:
    description: Release label written to dist/version.json
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: src/problem4/frontend/package-lock.json

    - name: Install and build
      shell: bash
      working-directory: src/problem4/frontend
      run: |
        npm ci
        npm audit --audit-level=high
        npm run build

    # Checked after deploy to prove CloudFront serves this build. The version
    # is not grepped from HTML, because bundlers move and minify it.
    - name: Stamp version
      shell: bash
      working-directory: src/problem4/frontend
      env:
        VERSION: ${{ inputs.version }}
      run: printf '{"version":"%s"}\n' "$VERSION" > dist/version.json
